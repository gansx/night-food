services:
  night-food-web:
    container_name: night-food-web
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile.next-app
      args:
        APP_SCOPE: "@night-food/web"
        APP_DIR: "web"
        PORT: "3000"
        NEXT_PUBLIC_BASE_PATH: ${WEB_BASE_PATH}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_ADMIN_SITE_URL: ${NEXT_PUBLIC_ADMIN_SITE_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    environment:
      PORT: "3000"
      NEXT_PUBLIC_BASE_PATH: ${WEB_BASE_PATH}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_ADMIN_SITE_URL: ${NEXT_PUBLIC_ADMIN_SITE_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      HOUSEHOLD_DEFAULT_NAME: ${HOUSEHOLD_DEFAULT_NAME:-Night Food Home}
      OWNER_INVITE_EXPIRY_HOURS: ${OWNER_INVITE_EXPIRY_HOURS:-48}
      POINTS_EXCHANGE_RATE: ${POINTS_EXCHANGE_RATE:-1}
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - shared_8088

  night-food-admin:
    container_name: night-food-admin
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile.next-app
      args:
        APP_SCOPE: "@night-food/admin"
        APP_DIR: "admin"
        PORT: "3001"
        NEXT_PUBLIC_BASE_PATH: ${ADMIN_BASE_PATH}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_ADMIN_SITE_URL: ${NEXT_PUBLIC_ADMIN_SITE_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    environment:
      PORT: "3001"
      NEXT_PUBLIC_BASE_PATH: ${ADMIN_BASE_PATH}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_ADMIN_SITE_URL: ${NEXT_PUBLIC_ADMIN_SITE_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      HOUSEHOLD_DEFAULT_NAME: ${HOUSEHOLD_DEFAULT_NAME:-Night Food Home}
      OWNER_INVITE_EXPIRY_HOURS: ${OWNER_INVITE_EXPIRY_HOURS:-48}
      POINTS_EXCHANGE_RATE: ${POINTS_EXCHANGE_RATE:-1}
    restart: unless-stopped
    expose:
      - "3001"
    networks:
      - shared_8088

networks:
  shared_8088:
    external: true
    name: shared-8088-net

