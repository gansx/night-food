name: Deploy Admin

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/family-web-cloudflare
    paths:
      - "apps/admin/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.json"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 2f4697448b060e1148c70d587b421974
      NEXT_PUBLIC_SUPABASE_URL: https://vlztpqhqjnucfwepxwbw.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ZTdcGQMO3i_RuNA2jO3VkQ_qVjnyEaX
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin worker
        working-directory: apps/admin
        run: pnpm cf:build

      - name: Sync admin runtime secret
        working-directory: apps/admin
        run: printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | pnpm exec wrangler secret put SUPABASE_SERVICE_ROLE_KEY

      - name: Deploy admin worker
        working-directory: apps/admin
        run: pnpm cf:deploy -- --keep-vars
